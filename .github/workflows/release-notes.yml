name: Update published release notes

on:
  push:
    branches: [main]
    paths:
      - 'docs/releases/**'
      - 'docs/images/**'
      - '.github/workflows/release-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Update notes for the current published version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print("v" + json.load(open("package.json"))["version"])')
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > /tmp/published-tags
          if ! grep -Fxq "$tag" /tmp/published-tags; then
            echo "No published release for $tag yet; tag workflow will publish its notes."
            exit 0
          fi
          test -f "docs/releases/$tag.md"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "docs/releases/$tag.md"
